name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore TechnicalTest.sln
      - run: dotnet build TechnicalTest.sln --configuration Release --no-restore
      - run: dotnet test TechnicalTest.sln --configuration Release --no-build
